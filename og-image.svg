<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HIIT Trainer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="90" r="220" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="170" cy="560" r="180" fill="#06b6d4" opacity="0.1"/>

  <g filter="url(#glow)">
    <path d="M90 360 L190 220 L290 410 L390 150 L490 380 L590 250 L690 430 L790 200 L890 360 L1010 290" fill="none" stroke="url(#pulse)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="90" y="170" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" opacity="0.9">ENTRENAMIENTO FUNCIONAL EN CASA</text>
  <text x="90" y="280" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="900">HIIT Trainer</text>
  <text x="90" y="340" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="600">Constructor de Rutinas</text>

  <g>
    <rect x="90" y="430" rx="16" ry="16" width="230" height="68" fill="#0ea5e9" opacity="0.18"/>
    <text x="120" y="474" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Temporizador</text>
  </g>

  <g>
    <rect x="345" y="430" rx="16" ry="16" width="190" height="68" fill="#6366f1" opacity="0.2"/>
    <text x="375" y="474" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Videos</text>
  </g>

  <g>
    <rect x="560" y="430" rx="16" ry="16" width="250" height="68" fill="#22c55e" opacity="0.18"/>
    <text x="590" y="474" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Progreso</text>
  </g>
</svg>
